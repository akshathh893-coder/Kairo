<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DAMS bench</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 24px; color: #1c2230; }
      h1 { font-size: 18px; }
      h2.ok { color: #16a34a; }
      h2.fail { color: #dc2626; }
      table { border-collapse: collapse; font-size: 13px; margin-top: 8px; }
      th, td { border: 1px solid #dfe3ec; padding: 6px 10px; text-align: right; }
      th:first-child, td:first-child { text-align: left; }
      .muted { color: #8a93a6; font-size: 12px; }
      button { padding: 10px 16px; font-size: 14px; border-radius: 10px; border: 1px solid #dfe3ec; background: #fff; cursor: pointer; }
    </style>
  </head>
  <body>
    <h1>DAMS Universal Extractor — benchmarks · stress · memory</h1>
    <p>Deck sizes 10 / 100 / 1000 / 10000. Timings in ms; heap delta in MB (Chromium).</p>
    <button onclick="DAMS.__runBench()">Re-run</button>
    <div id="out"><em>Running…</em></div>

    <script src="../vendor/acorn.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/core/interfaces.js"></script>
    <script src="../js/adapters/storage.adapter.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/loader.js"></script>
    <script src="../js/extractor.js"></script>
    <script src="../js/normalizer.js"></script>
    <script src="../js/sandbox.js"></script>
    <script src="../js/quiz.js"></script>
    <script src="../js/search.js"></script>
    <script src="../js/anki.js"></script>
    <script src="../js/export.js"></script>
    <script src="../js/parser.js"></script>
    <script src="../js/core/engine.js"></script>
    <script src="bench.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => DAMS.__runBench());
    </script>
  </body>
</html>
